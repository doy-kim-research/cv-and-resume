name: Render and Deploy CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "rmarkdown", "knitr",
            "vitae", "tidyverse",
            "glue", "readr", "RefManageR",
            "tinytex"
          ))'

      - name: Install TinyTeX and LaTeX packages
        run: |
          Rscript -e 'tinytex::install_tinytex()'
          Rscript -e 'tinytex::tlmgr_install(c(
            "moderncv", "fontawesome5", "fontawesome",
            "tcolorbox", "pgf",
            "environ", "trimspaces", "etoolbox",
            "unicode-math", "ucharcat"
          ))'

      - name: Patch moderncv.cls to define missing social symbols
        run: |
          CLS=$(find ~/.TinyTeX -name 'moderncv.cls' | head -n 1)
          echo "Patching: $CLS"
          # Insert empty definitions for social symbols that older moderncv.cls
          # versions omit. \providecommand only defines a symbol if it does not
          # already exist, so existing icons (LinkedIn, GitHub) are untouched.
          # Inserted before \endinput so they load while the class is read.
          perl -i -pe 's/\\endinput/\\providecommand{\\mastodonsocialsymbol}{}\n\\providecommand{\\discordsocialsymbol}{}\n\\providecommand{\\twitchsocialsymbol}{}\n\\providecommand{\\youtubesocialsymbol}{}\n\\providecommand{\\tiktoksocialsymbol}{}\n\\providecommand{\\instagramsocialsymbol}{}\n\\providecommand{\\soundcloudsocialsymbol}{}\n\\providecommand{\\steamsocialsymbol}{}\n\\providecommand{\\xboxsocialsymbol}{}\n\\providecommand{\\playstationsocialsymbol}{}\n\\providecommand{\\battlenetsocialsymbol}{}\n\\endinput/' "$CLS"
          echo "Patch complete."

      - name: Render CV
        run: Rscript -e 'rmarkdown::render("cv.Rmd", output_file = "cv.pdf")'

      - name: Move PDF to docs/
        run: |
          mkdir -p docs
          cp cv.pdf docs/cv.pdf

      - name: Commit and push rendered PDF
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/cv.pdf
          git diff --staged --quiet || git commit -m "chore: auto-render CV [skip ci]"
          git push